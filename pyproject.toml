[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enh3bench"
version = "0.0.1"
description = "A no-API benchmark for AI-assisted extraction and validation of electrochemical ammonia synthesis literature."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "eNH3-Bench contributors" }
]
dependencies = [
  "jsonschema>=4.21",
  "openpyxl>=3.1",
  "requests>=2.31"
]

[project.optional-dependencies]
dev = [
  "pytest"
]
document = [
  "python-docx",
  "docling",
  "markitdown",
  "pymupdf"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["enh3bench*"]
exclude = [
  "config*",
  "data*",
  "docs*",
  "input_raw*",
  "input_markdown*",
  "review_artifacts*",
  "scripts*",
  "tests*",
]
namespaces = false
