name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m compileall enh3bench scripts
      - run: python -m unittest discover
      - name: Verify authoritative Gold exact integrity when available
        if: >-
          ${{ hashFiles('data/gold/enrr_round1_oa_20260712/human_gold_claim_rights.jsonl') != '' &&
              hashFiles('data/gold/enrr_round1_oa_20260712/human_gold_claim_rights.csv') != '' }}
        run: >-
          python scripts/check_gold_integrity.py
          --run-name enrr_round1_oa_20260712
          --require-baseline
          --output /tmp/gold_integrity.json
